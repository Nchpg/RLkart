name: images

# Construit, contrôle et publie les images sur ghcr.io ; think les repère et les déploie
# quelques minutes après le push. Logique commune : Nchpg/.dotfiles, app-image.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  image:
    uses: Nchpg/.dotfiles/.github/workflows/app-image.yml@main
    with:
      images: '[{"name": "rlkart-frontend", "dockerfile": "frontend/Dockerfile"}, {"name": "rlkart-backend", "dockerfile": "backend/Dockerfile"}]'
    permissions:
      contents: read
      packages: write
